version: '3.8'

services:
  web:
    build: .
    container_name: car-detection-web
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/data/uploads
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - YOLO_DEVICE=cpu
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
